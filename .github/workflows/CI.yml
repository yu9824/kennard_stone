# Regrences
# - https://enu23456.hatenablog.com/entry/2022/11/24/195744
name: CI
run-name: ${{ github.workflow }} (${{ github.ref_name }})

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  # A workflow skipped by on.<event>.paths leaves its checks "Pending",
  # which blocks merging if they are required. A job skipped by its "if"
  # condition is reported as "Success", so the paths are checked here with
  # dorny/paths-filter instead.
  changes:
    runs-on: ubuntu-latest
    # paths-filter reads the pull request diff through the REST API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # On push, the diff is computed from the git history, so fetch it all.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # workflow_dispatch has nothing to compare with; always run the tests.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - '**/*.py'
              - '.github/workflows/CI.yml'
              - 'pyproject.toml'

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - uses: actions/checkout@v7
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        pip install ".[test]"
    - name: Test with pytest
      run: |
        pytest -xs
